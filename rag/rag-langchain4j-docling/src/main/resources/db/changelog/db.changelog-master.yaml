databaseChangeLog:

  # ============================================================
  # 1. Create PostgreSQL extensions and vector_store table
  # ============================================================
  - changeSet:
      id: 1
      author: ai
      changes:
        - sql:
            splitStatements: true
            sql: |
              CREATE EXTENSION IF NOT EXISTS vector;
              CREATE EXTENSION IF NOT EXISTS "uuid-ossp";

              CREATE TABLE IF NOT EXISTS vector_store (
                  embedding_id uuid DEFAULT uuid_generate_v4() PRIMARY KEY,
                  text text,
                  metadata jsonb,
                  content_tsv tsvector,
                  embedding vector(384)
              );
  # ============================================================
  # 2. Create indexes
  # ============================================================
  - changeSet:
      id: 2
      author: ai
      changes:
        - sql:
            splitStatements: true
            sql: |
              CREATE INDEX IF NOT EXISTS vector_store_content_tsv_idx
              ON vector_store USING GIN(content_tsv);

              CREATE INDEX IF NOT EXISTS vector_store_metadata_idx
              ON vector_store USING GIN(metadata);

  # ============================================================
  # 3. Create/update trigger function
  # ============================================================
  - changeSet:
      id: 3
      author: ai
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE OR REPLACE FUNCTION update_content_tsv()
              RETURNS trigger AS $$
              BEGIN
                  NEW.content_tsv :=
                      to_tsvector(
                          'english',
                          coalesce(NEW.text, '')
                      );
                  RETURN NEW;
              END
              $$ LANGUAGE plpgsql;

  # ============================================================
  # 4. Create trigger and populate existing rows
  # ============================================================
  - changeSet:
      id: 4
      author: ai
      changes:
        - sql:
            splitStatements: true
            sql: |
              DROP TRIGGER IF EXISTS trigger_update_content_tsv
              ON vector_store;

              CREATE TRIGGER trigger_update_content_tsv
              BEFORE INSERT OR UPDATE ON vector_store
              FOR EACH ROW
              EXECUTE FUNCTION update_content_tsv();

              UPDATE vector_store
              SET content_tsv =
                  to_tsvector(
                      'english',
                      coalesce(text, '')
                  )
              WHERE content_tsv IS NULL;