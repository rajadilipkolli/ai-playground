spring.application.name=rag-langchain4j-docling

# Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Liquibase
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.yaml

# Docling configuration
docling.server-url=http://localhost:5001

# LangChain4j properties
langchain4j.rag.chunking.size=300
langchain4j.rag.chunking.overlap=50

# Directory ingestion is restricted to this filesystem subtree.
ingestion.allowed-base-directory=${INGESTION_ALLOWED_BASE_DIRECTORY:./ingestion}
