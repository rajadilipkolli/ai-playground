name: Model Regression Detection

on:
  push:
    branches:
      - main
    paths:
      - 'eval/model-regression-detection/**'
      - '.github/workflows/model-regression-detection.yml'
  pull_request:
    paths:
      - 'eval/model-regression-detection/**'
      - '.github/workflows/model-regression-detection.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: evaldb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      ollama:
        image: ollama/ollama:latest
        ports:
          - 11434:11434
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5.7.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Pull Llama 3.2 Model
        run: |
          sleep 5
          curl -X POST http://localhost:11434/api/pull -d '{"name": "llama3.2"}'

      - name: Run Evaluation Pipeline
        id: eval
        continue-on-error: true
        env:
          SPRING_PROFILES_ACTIVE: pipeline
          OLLAMA_BASE_URL: http://localhost:11434
          DB_URL: jdbc:postgresql://localhost:5432/evaldb
          DB_USER: postgres
          DB_PASSWORD: password
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          cd eval/model-regression-detection
          ./mvnw spring-boot:run
          if [ $? -eq 1 ]; then
            echo "critical=true" >> $GITHUB_OUTPUT
          else
            echo "critical=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload HTML Report
        uses: actions/upload-artifact@v7
        with:
          name: regression-report
          path: eval/model-regression-detection/target/regression-report.html

      - name: Find Comment
        uses: peter-evans/find-comment@v3
        id: fc
        if: github.event_name == 'pull_request'
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: <!-- EVAL_MARKER -->

      - name: Create or update comment
        uses: peter-evans/create-or-update-comment@v4
        if: github.event_name == 'pull_request'
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            <!-- EVAL_MARKER -->
            ## Model Regression Evaluation Complete
            The regression pipeline has finished running. 
            Download the HTML report from the artifacts section to see the diffs.
            Critical regression detected: **${{ steps.eval.outputs.critical }}**
          edit-mode: replace

      - name: Fail on Critical
        if: steps.eval.outputs.critical == 'true'
        run: |
          echo "Critical regression detected!"
          exit 1
